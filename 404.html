<!doctype html>
<!--
  RÖSTLABBET – vidarebefordran (404.html)
  Alla adresser som inte finns på hemsidan (t.ex. /login, /courses/..., /f/...) låg tidigare i Zenler.
  Den här sidan skickar besökaren vidare till samma adress på kurs.rostlabbet.se.
  Ändra inte om du inte vet vad du gör.
-->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Röstlabbet – skickar dig vidare</title>
<script>
  (function(){
    var target = 'https://rostlabbet.newzenler.com' + location.pathname + location.search + location.hash;
    location.replace(target);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FDF0D5;color:#1A1A1B;font-family:"Segoe UI",Arial,sans-serif;text-align:center;padding:24px}
  a{color:#780000;font-weight:600}
</style>
</head>
<body>
  <main>
    <p>Du skickas vidare till Röstlabbets kurssidor…</p>
    <p><a id="go" href="https://rostlabbet.newzenler.com/">Klicka här om inget händer</a></p>
  </main>
  <script>
    document.getElementById('go').href = 'https://rostlabbet.newzenler.com' + location.pathname + location.search + location.hash;
  </script>
</body>
</html>
