<!doctype html>
<!--
  RÖSTLABBET – vidarebefordran (404.html)
  Gamla adresser från tiden då rostlabbet.se låg i Zenler (Google har dem fortfarande).
  - Gamla informationssidor (kontakt, medlemskap, vocal-labs …) skickas till rätt ställe på nya hemsidan.
  - Allt annat (inloggning, kurser, köp, funnel, community) skickas till samma adress på kurs.rostlabbet.se.
  Ändra inte om du inte vet vad du gör.
-->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Röstlabbet – skickar dig vidare</title>
<script>
  (function(){
    // Old Zenler info pages -> new site (path without trailing slash, lower case)
    var MAP = {
      '/home': '/',
      '/medlemskap': '/#ingar',
      '/rostlabbet-medlemskap': '/#ingar',
      '/vocal-labs': '/#ingar',
      '/sjung-smart': '/#mer',
      '/workshops': '/workshops.html',
      '/om-monica': '/#monica',
      '/kontakt': '/#kontakt',
      '/calendar': '/#manad',
      '/kalender': '/#manad',
      '/terms': '/villkor.html',
      '/privacypolicy': '/integritetspolicy.html',
      '/cookiepolicy': '/cookiepolicy.html',
      '/support': '/#kontakt'
    };
    var p = location.pathname.replace(/\/+$/, '').toLowerCase();
    var target = MAP[p] || ('https://kurs.rostlabbet.se' + location.pathname + location.search + location.hash);
    location.replace(target);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FDF0D5;color:#1A1A1B;font-family:"Segoe UI",Arial,sans-serif;text-align:center;padding:24px}
  a{color:#780000;font-weight:600}
</style>
</head>
<body>
  <main>
    <p>Du skickas vidare…</p>
    <p><a href="/">Till Röstlabbets startsida</a></p>
  </main>
</body>
</html>
