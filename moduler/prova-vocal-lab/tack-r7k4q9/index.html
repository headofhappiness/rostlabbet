<!doctype html>
<!--
  RÖSTLABBET – tacksidan för modulen Prova en Vocal Lab.
  Hit skickar Stripe köparen efter betalningen (Betallänk → Efter betalning → Skicka kunden till din webbplats).
  Mappnamnet är medvetet svårt att gissa. Länka aldrig hit från sajten.
-->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tack för ditt köp – Röstlabbet</title>
<meta name="theme-color" content="#780000">
<link rel="icon" type="image/png" href="../../../media/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=League+Spartan:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one red card on cream, the code big and copyable, one button onward. */
:root{color-scheme:light;--vocal:#780000;--signal:#C1121F;--lab:#00A6E6;--cream:#FDF0D5;--ink:#1A1A1B;--ink-soft:#4d4542;--line:#e9d2a6;
  --f-display:"Anton",Impact,sans-serif;--f-script:"Caveat",cursive;--f-label:"League Spartan",Arial,sans-serif;--f-body:"Hanken Grotesk","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6}
:focus-visible{outline:3px solid var(--lab);outline-offset:3px}
.card{width:100%;max-width:520px;background:var(--vocal);color:var(--cream);border-radius:24px;padding:clamp(28px,6vw,48px);text-align:center;box-shadow:0 30px 60px rgba(120,0,0,.25)}
.logo{height:52px;width:auto;background:var(--cream);border-radius:12px;padding:8px 12px;margin:0 auto 24px;display:block}
h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.15;margin:0}
.script{display:block;font-family:var(--f-script);font-weight:600;text-transform:none;color:var(--lab);font-size:.5em;transform:rotate(-4deg)}
p{margin:16px 0 0}
.code{margin:24px 0 0;padding:16px;border:2px dashed var(--cream);border-radius:16px}
.code small{display:block;font-family:var(--f-label);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.72rem;opacity:.8}
.code b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.4rem;letter-spacing:.12em;user-select:all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-top:26px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.9rem;text-decoration:none;padding:17px 28px 15px;border-radius:999px;background:var(--lab);color:var(--ink)}
.btn:hover{background:#2bb8ee}
.small{font-size:.9rem;opacity:.8}
.small a{color:var(--cream)}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="../../../media/rostlab-logga.png" alt="Röstlabbet" width="261" height="147">
  <h1>Tack för ditt köp!<span class="script">nu kör vi</span></h1>
  <p>Din modul <b>Prova en Vocal Lab</b> är redo. Spara koden, så kommer du in igen från en annan mobil eller dator.</p>
  <div class="code"><small>Din kod</small><b>SJUNG</b></div>
  <a class="btn" href="../?kod=SJUNG">Öppna modulen <span aria-hidden="true">→</span></a>
  <p class="small">Kvittot kommer i ett mejl från Stripe. Frågor? Mejla <a href="mailto:monica@rostlabbet.se">monica@rostlabbet.se</a>.</p>
</main>
</body>
</html>
